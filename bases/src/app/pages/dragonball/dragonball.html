<h1>Dragon Ball</h1>
<hr/>
<section class="row">
  <div class="col-12 col-sm-6">
    <h3>Agregar</h3>
    <input type="text" class="form-control" placeholder="Nombre del personaje" #inputPersonaje />
    <input type="number" class="form-control mt-2" placeholder="poder" #inputPoder />
    <button class="btn btn-primary mt-2">
      Agregar
    </button>
  </div>
  <div class="col-12 col-sm-6">
    <h3>Personajes</h3>
    <p>Lista de personajes</p>
    <ul>
      @for (character of characters(); track character.id; let idx = $index) {
       <li>
        <span>{{idx + 1}}-{{ character.name }}</span>
        <strong class="text-danger">{{ character.power }}</strong>
       </li>
        }


    </ul>
  </div>
</section>
